; 複製成 winvoice.ini（同一個資料夾）再填入金鑰。winvoice.ini 不會進 git。
[winvoice]
; Azure 語音資源的「金鑰 1」。也可以改用環境變數 AZURE_SPEECH_KEY。
key =
; Azure 語音資源的區域，例如 eastasia（香港）、japaneast、southeastasia。
region = eastasia
; 用自訂網域的資源才需要填，例如 https://my-speech.cognitiveservices.azure.com
; 有填 endpoint 時 region 可以留空。
endpoint =

; short：免費方案（F0）可用，單次最長 60 秒，不吃詞彙表。
; fast ：需要付費方案（S0），吃 vocab.txt 的詞彙表，藥名、縮寫比較準。
backend = short
language = zh-TW

; 錄音裝置名稱的一部分。找不到就用系統預設麥克風。
; 用 py winvoice.py --list-devices 查看名稱。
microphone = StickS3

; 詞彙表（只有 backend = fast 會用）。
vocab_file = vocab.txt

; 單次錄音上限（秒），到了自動停止送出。short 最多 58。
max_seconds = 55
; 短於這個秒數、或音量一直很小（例如 Stick 平放靜音）就不送出，不浪費額度。
min_seconds = 0.5
silence_peak = 300

; paste：剪貼簿 + Ctrl+V（預設，最快）。
; type ：逐字模擬輸入，給不接受貼上的程式用。
output = paste
; 貼上後把剪貼簿原本的文字放回去（圖片等非文字內容會被清掉）。
restore_clipboard = true

; 開始、停止、錯誤時嗶聲提示。
beep = true
; 記錄檔預設只記字數；true 會把辨識文字也寫進記錄檔（病歷內容，請小心）。
log_text = false
; 等 Azure 回應的秒數。
timeout = 30
