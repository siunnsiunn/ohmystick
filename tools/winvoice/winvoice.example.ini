; 複製成 winvoice.ini（同一個資料夾）再填入金鑰。winvoice.ini 不會進 git。
[winvoice]
; ---- Azure（backend = short 或 fast）----
; Azure 語音資源的「金鑰 1」。也可以改用環境變數 AZURE_SPEECH_KEY。
key =
; Azure 語音資源的區域，例如 eastasia（香港）、japaneast、southeastasia。
region = eastasia
; 用自訂網域的資源才需要填，例如 https://my-speech.cognitiveservices.azure.com
; 有填 endpoint 時 region 可以留空。
endpoint =

; ---- Groq（backend = groq）----
; https://console.groq.com/keys 建立的 API key（gsk_ 開頭）。也可以改用環境變數 GROQ_API_KEY。
groq_key =
; whisper-large-v3（較準）或 whisper-large-v3-turbo（較快）。
groq_model = whisper-large-v3
; Whisper 有時輸出簡體，轉成繁體（要先 py -m pip install opencc-python-reimplemented）。
; s2tw：只換字；s2twp：連用語一起換（软件→軟體）；留空不轉。
opencc = s2tw

; short：Azure 免費方案（F0），每月 5 小時，單次最長 60 秒，不吃詞彙表。
; fast ：Azure 付費方案（S0），吃 vocab.txt 的詞彙表。
; groq ：Groq 免費方案，每天約 8 小時，vocab.txt 當提示詞用。
backend = short
language = zh-TW

; 錄音裝置名稱的一部分。找不到就用系統預設麥克風。
; 用 py winvoice.py --list-devices 查看名稱。
microphone = StickS3

; 詞彙表（backend = fast 或 groq 會用）。
vocab_file = vocab.txt

; 單次錄音上限（秒），到了自動停止送出。short 最多 58。
max_seconds = 55
; 短於這個秒數、或音量一直很小（例如 Stick 平放靜音）就不送出，不浪費額度。
min_seconds = 0.5
silence_peak = 300

; paste：剪貼簿 + Ctrl+V（預設，最快）。
; type ：逐字模擬輸入，給不接受貼上的程式用。
output = paste
; 貼上後把剪貼簿原本的文字放回去（圖片等非文字內容會被清掉）。
restore_clipboard = true

; 開始、停止、錯誤時嗶聲提示。
beep = true
; 記錄檔預設只記字數；true 會把辨識文字也寫進記錄檔（病歷內容，請小心）。
log_text = false
; 等 Azure 回應的秒數。
timeout = 30

; ---- Wi-Fi（Stick 的「Wi-Fi 聽寫」App，測試中）----
; Stick 經區網連進來的埠號；0 = 不接受。
wifi_port = 47100
; 只接受這些位址連進來（逗號分隔）；預設是私有區網與 Tailscale。想更嚴可改成診所網段，例如 192.168.1.0/24。
wifi_allow = 192.168.0.0/16, 100.64.0.0/10
; 配對密碼，要和 Stick 設定頁填的一樣，至少 12 個字元；沒填就不接受 Stick 連線。
; 產生：py -c "import secrets;print(secrets.token_hex(10))"（另需 py -m pip install cryptography）
wifi_key =
